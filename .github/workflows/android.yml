name: DentPrep Android configuration
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Verified production HTTPS DentPrep URL (leave blank for configuration-only build)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      DENTPREP_APP_URL: ${{ inputs.app_url || 'https://example.invalid/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android configuration and run lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug -PdentprepUrl="$DENTPREP_APP_URL"
      - name: Upload debug build and lint report
        uses: actions/upload-artifact@v4
        with:
          name: dentprep-android-debug-configuration
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          retention-days: 7
