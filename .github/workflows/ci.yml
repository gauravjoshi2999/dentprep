name: DentPrep CI
on:
  pull_request:
  push:
    branches: [main, "import/**", "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source security
        run: npm run check:security
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Test live resource verification
        run: npm run test:release
      - name: Prepare and validate deployable Worker (no publication)
        run: |
          npm run build:release -- --allow-test-backend
          npm run check:worker
      - name: Smoke test actual built Cloudflare Worker
        run: npm run test:worker
      - name: Install browser for acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:browser
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
