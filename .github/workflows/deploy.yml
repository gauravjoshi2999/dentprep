name: DentPrep production release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_url:
        description: "Optional custom HTTPS origin; leave blank to verify the exact workers.dev URL returned by Wrangler"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dentprep-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate optional custom host
        env:
          RELEASE_URL: ${{ inputs.production_url }}
        run: |
          if [ -n "$RELEASE_URL" ]; then
            node --input-type=module -e 'const u = new URL(process.env.RELEASE_URL); if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash || u.pathname !== "/") throw Error("Expected an HTTPS origin");'
          fi
      - name: Confirm configured release prerequisites (presence only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Set the DentPrep backend URL in the production environment variables.'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Set the DentPrep public backend key in the production environment variables.'; exit 1; }
          test -n "$CF_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in the production environment secrets.'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in the production environment secrets.'; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run check:security
      - name: Enforce medical content package gates
        run: |
          npm run test:content
          npm run check:content
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Validate Worker package without publishing
        run: npm run check:worker
      - run: npm run test:worker
      - name: Deploy tested source
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run deploy:worker
      - name: Verify actual live revision and SSR
        env:
          RELEASE_URL: ${{ inputs.production_url || steps.deploy.outputs.worker_url }}
        run: |
          test -n "$RELEASE_URL" || { echo 'The deployed Worker URL could not be verified.'; exit 1; }
          npm run verify:deployment -- "$RELEASE_URL" "$GITHUB_SHA"
          printf 'Verified DentPrep release `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify live UI in clean mobile and desktop browsers
        env:
          DENTPREP_LIVE_ORIGIN: ${{ inputs.production_url || steps.deploy.outputs.worker_url }}
          DENTPREP_EXPECTED_REVISION: ${{ github.sha }}
        timeout-minutes: 10
        run: node scripts/diagnose-live-browser.mjs
      - name: Record exact release evidence for continuation
        env:
          DENTPREP_RELEASE_ORIGIN: ${{ inputs.production_url || steps.deploy.outputs.worker_url }}
        run: node scripts/record-release-evidence.mjs
      - name: Preserve release failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-failure-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dentprep-release-${{ github.sha }}
          path: .output/release-evidence.json
          retention-days: 90
          overwrite: true
