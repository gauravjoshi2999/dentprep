name: DentPrep production release
on:
  workflow_dispatch:
    inputs:
      production_url:
        description: Existing DentPrep HTTPS origin to verify after deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dentprep-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate configured host
        env:
          RELEASE_URL: ${{ inputs.production_url }}
        run: |
          node --input-type=module -e 'const u = new URL(process.env.RELEASE_URL); if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash || u.pathname !== "/") throw Error("Expected an HTTPS origin");'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:security
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Validate Worker package without publishing
        run: npm run check:worker
      - run: npm run test:worker
      - name: Deploy tested source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run deploy:worker
      - name: Verify actual live revision and SSR
        env:
          RELEASE_URL: ${{ inputs.production_url }}
        run: |
          npm run verify:deployment -- "$RELEASE_URL" "$GITHUB_SHA"
          printf 'Verified DentPrep release `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
